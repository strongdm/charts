## Test file to be merged with values.yaml.
##
## Set all "create" flags to true to exhaust as many config options as possible.
##
global:
  labels:
    foo: bar
  annotations:
    foo.bar/baz: sure

strongdm:
  discoveryUsername: bar
  auth:
    adminToken: foo.bar.baz
  serviceAccount:
    create: true
  autoRegisterCluster:
    enabled: true
  config:
    additionalEnvVars:
      foo: bar
      bar: 2
      baz: false
  pod:
    extraEnv:
      - name: SECRET_VALUE
        valueFrom:
          secretKeyRef:
            name: external-secret
            key: secret-value
    extraEnvFrom:
      - secretRef:
          name: external-environment
    extraVolumeMounts:
      - name: external-config
        mountPath: /etc/external
        readOnly: true
    extraVolumes:
      - name: external-config
        configMap:
          name: external-config
  rbac:
    create: true
